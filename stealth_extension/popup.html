<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stealth DOM Reader</title>
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #12141a;
      color: #e2e8f0;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    .header h2 {
      margin: 0;
      font-size: 15px;
      font-weight: 600;
      color: #38bdf8;
    }
    .badge {
      font-size: 10px;
      background: #0369a1;
      color: #f0f9ff;
      padding: 2px 6px;
      border-radius: 4px;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.5px;
    }
    .card {
      background: #1e2430;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
    }
    .indicator {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #ef4444;
      display: inline-block;
      margin-right: 6px;
      box-shadow: 0 0 6px #ef4444;
    }
    .indicator.connected {
      background: #22c55e;
      box-shadow: 0 0 6px #22c55e;
    }
    .tab-info {
      font-size: 11px;
      color: #94a3b8;
      word-break: break-all;
      margin-top: 6px;
    }
    .tab-title {
      color: #f8fafc;
      font-weight: 500;
      margin-bottom: 2px;
    }
    .stealth-note {
      font-size: 11px;
      color: #64748b;
      line-height: 1.4;
      border-top: 1px solid #1e293b;
      padding-top: 8px;
    }
    button {
      width: 100%;
      background: #2563eb;
      color: #ffffff;
      border: none;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>
  <div class="header">
    <h2>Stealth DOM Reader</h2>
    <span class="badge">Active Tab</span>
  </div>

  <div class="card">
    <div class="status-row">
      <span>Bridge Status:</span>
      <span><span id="dot" class="indicator"></span><strong id="statusText">Disconnected</strong></span>
    </div>
  </div>

  <div class="card">
    <div class="tab-title" id="tabTitle">Detecting active tab...</div>
    <div class="tab-info" id="tabUrl">-</div>
  </div>

  <div class="stealth-note">
    🔒 <strong>Stealth Mode:</strong> No debugger banner. Active tab only. Read-only DOM extraction.
  </div>

  <script src="popup.js"></script>
</body>
</html>
